name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install current Pi
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent
          pi --version

      - name: Install YAML parser for SKILL.md checks
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check pyyaml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Shell syntax
        run: bash -n install-pi-config.sh run-tests.sh

      - name: Test suite
        run: bash run-tests.sh
