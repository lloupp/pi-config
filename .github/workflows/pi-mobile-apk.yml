name: Pi Mobile APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/pi-mobile/**'
      - '.github/workflows/pi-mobile-apk.yml'
  pull_request:
    paths:
      - 'apps/pi-mobile/**'
      - '.github/workflows/pi-mobile-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu already contains Android SDK tools; setup-android v3\n      # attempts to install the retired 'tools' package and now fails.\n      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test Node bridge
        run: node --test apps/pi-mobile/tests/*.test.cjs
      - name: Build Android APK
        working-directory: apps/pi-mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pi-mobile-debug-apk
          path: apps/pi-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
